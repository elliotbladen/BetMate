name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks needs history, not just the tip
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Type-check, lint and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
        continue-on-error: true   # 59 pre-existing findings; flip to blocking once cleared
      - name: npm audit
        # xlsx has two HIGH advisories with no upstream fix, so high would always
        # fail. Gate on critical and let Dependabot carry the rest.
        run: npm audit --audit-level=critical

  python:
    name: Python audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r cloud/requirements.txt
