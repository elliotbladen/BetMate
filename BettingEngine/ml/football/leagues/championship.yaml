# EFL Championship league config — see CHAMPIONSHIP_PLAN.md.
#
# GOALS-FED: no Understat coverage → xg_csv null → D-C fits on actual goals.
# No PPDA → T2 pressing inactive (t2 returns 0.0 when ppda is None).
#
# ⚠️ VAULT RULE (user decision 2026-07-09): 2025/26 is a hold-out season.
# It exists in the fetched data (needed for the final frozen-model run) but must
# NEVER appear in test_seasons/feature_seasons or any development evaluation.
#
# Tier constants marked [E1-DERIVED] are computed from the fetched 2014/15–2024/25
# data (scripts below); others start as EPL values pending backtest evidence.
key: championship
name: EFL Championship

data:
  matches_csv: matches/championship_matches.csv
  xg_csv: null                        # goals-fed — no xG source for this league
  ppda_csv: style/ppda_dated.csv      # manual FBref seed — update weekly
  clubelo_csv: clubelo/season_ratings.csv  # run fetch/fetch_clubelo.py to populate
  clv_dir: clv
  xg_fallback_factor: 1.0             # unused in goals-fed mode

source:
  provider: football-data
  league_code: E1
  seasons_from: "2014/15"
  seasons_to: "2026/27"               # live season; 2025/26 remains the sealed evaluation vault

model:
  rho: -0.13                          # start at EPL value; revisit vs ~33% draw rate
  dc_weight: 0.70
  elo_weight: 0.30
  decay_rate: 0.001                   # candidate for lengthening (goals noisier); tune in Phase 5
  min_train: 200
  between_season_omega: 0.770
  # Clubs new to the division (promoted or relegated in) carry stale D-C parameters
  # from the last time they were here. "league_average" wipes them to exactly average
  # and also discards their current-season results — which rated West Ham and Wolves
  # as average Championship sides in GW7 2026/27, and both comfortably outplayed the
  # team the model preferred. "shrunk_current_season" instead refits on this season
  # alone and shrinks toward average by n/(n+new_team_shrink_games), so six games move
  # the rating halfway and nothing swings on one result. Falls back to league average
  # automatically when the season is too young to fit.
  # THREE MODES TESTED, ALL THREE FAILED — left at league_average. Each was
  # pre-registered before it was run and each is implemented and still available
  # behind this key. Same harness every time: 10-season walk-forward, 2,436
  # fixtures, 2025/26 sealed. Do not switch one on without reading its result doc.
  #   shrunk_current_season  1X2 -0.0053 (7/10)   O/U +0.0174 (0/10)
  #   elo_seeded             1X2 -0.0188 (10/10)  O/U +0.0142 (2/10)
  #   elo_seeded_level_neutral 1X2 -0.0182 (10/10) O/U +0.0063 (4/10)
  # All three fail on totals. The cause is the model's algebra, not the methods:
  # lam = base x att / def_away means defence DIVIDES, so any spread away from 1.0
  # raises expected goals even when symmetric. att = def = 1.0 — what league_average
  # sets — is the unique level-neutral pair. The level-neutral variant removed 83%
  # of the level shift but only 56% of the O/U damage, so the diagnosis is
  # incomplete: part of the harm is the spread itself, not the level.
  # ⚠️ elo_seeded's 1X2 gain is the best result measured on this model (10/10
  # seasons) and fails ONLY on totals. A per-market split — elo_seeded for 1X2,
  # league_average for totals — is the obvious next test and has NOT been run.
  # See RESET_FIX_BACKTEST_RESULT.md, ELO_SEEDED_RESULT.md, LEVEL_NEUTRAL_RESULT.md.
  # TOTALS + ASIAN HANDICAP. Stays league_average: all three alternatives made
  # totals worse, and the totals model is not bet (it loses to a constant
  # base-rate guess pooled, 0.69263 vs 0.69107).
  new_team_reset: league_average
  # 1X2 ONLY. Signed off 2026-09-15. elo_seeded scored 1.0366 against the
  # league_average baseline's 1.0554 — better in 10 of 10 seasons, 9 of 9
  # dropping 2015/16 where Elo has one prior season. Best result measured on
  # this model. It is a better MODEL, not an edge: the de-vigged close scores
  # 1.0172, so do not bet Championship 1X2 off it.
  new_team_reset_1x2: elo_seeded
  new_team_shrink_games: 6.0

elo:
  home_advantage: 65.0                # kept at EPL value — E1 home-win 43.2% vs EPL 44.6%,
                                      # so no evidence of stronger HFA (research claim disproven by data)
  k_base: 20.0
  k_new: 40.0
  k_new_threshold: 20
  between_season_reversion: 0.30
  draw_base: 0.27                     # [E1-DERIVED] actual draw rate 26.9% — EPL value confirmed

backtest:
  # Pristine direct-fetched data 2026-07-10 (hotspot) — all 12 seasons complete with
  # full odds. Four test seasons for extra evidence. 2025/26 = VAULT, never here.
  test_seasons: ["2021/22", "2022/23", "2023/24", "2024/25"]
  feature_seasons: ["2017/18", "2018/19", "2019/20", "2020/21",
                    "2021/22", "2022/23", "2023/24", "2024/25"]

tiers:
  league_ppda_sum: 24.0               # 2 x 12.0 avg Championship opponent-shots proxy
  league_ref_goals: 1.416             # [E1-DERIVED] avg FTHG across 127 refs, n=6072 (pristine data, vault excluded)
  short_rest_days: 3                  # [E1-DERIVED] E1 median rest is 4d and 50.3% of games
                                      # are <=4d — EPL threshold would penalise half the league.
                                      # <=3d = 27.9% (genuine midweek turnarounds)
  fatigue_factor: 0.94
  corners_home_avg: 5.641             # [E1-DERIVED] n=6071 (pristine data, vault excluded)
  corners_away_avg: 4.624             # [E1-DERIVED]
  sp_xg_per_corner: 0.042
  sp_weight: 0.35
  sp_cap: 0.08
  ppda_goals_coef: -0.007             # each 1pt ppda_sum above avg → -0.007 xG per team
  form_goals_coef: 0.008
  ref_goals_coef: 0.5
  # T8: season-reset prior for the 6 new teams each August
  # Prior decays linearly to 0 by game 15. ELO scale: +600pts ≈ +0.15 xG.
  # Avg champ ELO ~1440 (from fetched data). Relegated PL team ~1600-1700,
  # promoted L1 team ~1200-1300 → diffs of +200 to -200 → ±0.05 xG at full weight.
  t8_decay_games: 15
  t8_max_adj: 0.15
  t8_elo_scale: 600.0
  # T9: new manager bounce
  t9_manager_adj: 0.07

# Opening-round priors when ClubElo is unavailable. Values are Elo points
# relative to an established Championship club and are intentionally modest.
# Relegated PL: Burnley, West Ham, Wolves. Promoted L1: Bolton, Cardiff, Lincoln.
new_team_elo_priors:
  "2026/27":
    Burnley: 180
    West Ham: 180
    Wolves: 180
    Bolton: -180
    Cardiff: -180
    Lincoln: -180
