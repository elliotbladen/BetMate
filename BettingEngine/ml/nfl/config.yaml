league: nfl
version: nfl-preopen-v1-nrl-patterns

data_contract:
  version: nfl-data-contract-v1.0
  canonical_game_id: nflverse_yyyy_ww_away_home
  spread_convention: home_team_handicap_negative_home_favourite
  historical_feature_timing: week_n_uses_completed_games_through_week_n_minus_1
  regular_season_only: true
  market_columns_are_features: false
  labels_are_features: false

objective:
  primary: model_closer_to_close_than_open
  secondary: positive_closing_line_value
  markets: [spread, total]
  prediction_cutoff_hours_before_open: 1

data:
  schedules: nflverse_nfldata
  play_by_play: nflverse_pbp
  rosters: nflverse_weekly_rosters
  injuries: nflverse_injuries
  depth_charts: nflverse_depth_charts
  opening_snapshots: the_odds_api
  snapshot_poll_minutes: 5
  seasons:
    train_from: 2014
    development_through: 2024
    final_vault: 2025

engines:
  structural:
    role: official_candidate
    family: hierarchical_margin_total
    can_publish: true
  ml_shadow:
    role: independent_challenger
    family: shallow_gradient_boosting
    can_publish: false
    can_mutate_structural_price: false
    heads: [margin, h2h_direct, total]
    exclude_structural_tier_outputs: true
  market_shadow:
    role: after_open_line_movement
    target: consensus_close_minus_consensus_open
    can_publish_as_preopen: false

model:
  distribution: empirical_residual
  core:
    pass_epa_weight: 1.0
    rush_epa_weight: 0.45
    success_rate_weight: 0.35
    early_down_weight: 1.0
    late_down_weight: 0.55
    garbage_time_win_probability_low: 0.05
    garbage_time_win_probability_high: 0.95
  recency:
    in_season_half_life_games: 6
    prior_season_retention: 0.35
    defence_regression_multiplier: 1.25
  components:
    - opponent_adjusted_offence
    - opponent_adjusted_defence
    - special_teams
    - quarterback
    - coaching_and_roster_prior
    - home_field
    - rest_travel_surface_weather

step2_baselines:
  status: frozen_development
  training_start: 2014
  rolling_test_seasons: [2019, 2020, 2021, 2022, 2023, 2024]
  final_vault_excluded: 2025
  ridge_alpha: 25.0
  elo:
    starting_rating: 1500.0
    k_factor: 20.0
    home_field_points: 2.2
  rule_eras:
    dynamic_kickoff_from: 2024
    onside_anytime_when_trailing_from: 2025
    kickoff_touchback_35_from: 2025
    regular_season_ot_both_possess_from: 2025
    onside_alignment_revision_from: 2026
  leakage_policy:
    actual_onside_attempts_are_pregame_features: false
    actual_onside_recoveries_are_pregame_features: false

step3_personnel_context:
  status: shadow
  development_seasons: [2019, 2020, 2021, 2022, 2023, 2024]
  quarterback:
    prior_dropbacks: 150
    uncertain_starter_method: probability_weighted_starter_backup_mixture
    historical_actual_starter_is_research_only: true
  roster_continuity:
    active_statuses: [ACT, INA]
    features: [weekly_overlap, returning_roster, returning_ol, returning_receivers]
  injuries:
    method: timestamp_checked_position_weighted_report_burden
    snap_weighted: false
    promotion_allowed: false
  weather:
    historical_schedule_observation_is_oracle_only: true
    requires_timestamped_forecast_for_live_use: true
  promotion:
    require_real_feature_to_beat_shuffled_control: true
    require_prospective_starter_probabilities: true

step3_5_qb_lab:
  status: deep_shadow
  first_source: nflverse_ftn_charting
  current_cost_usd: 0
  historical_from: 2022
  posterior_prior_plays: 100
  feature_families:
    - accuracy_and_catchability
    - decision_and_interception_worthy
    - quarterback_fault_sacks
    - pocket_movement_and_blitz
    - play_action_and_motion
  paid_provider_order: [pff_csv_trial, sis_api_sample, genius_ngs_enterprise]
  paid_data_may_change_official_price: false

step4_challenger:
  status: independent_shadow
  algorithm: shallow_gradient_boosting
  trees: 120
  learning_rate: 0.025
  max_depth: 2
  min_samples_leaf: 40
  subsample: 0.75
  tier_outputs_allowed: false
  market_features_allowed: false
  authoritative_h2h: margin_derived
  direct_h2h_status: rejected_shadow
  blending:
    enabled: false
    minimum_frozen_prospective_predictions: 500

tiers:
  t0_data_health:
    mode: active
    action: abstain
    triggers: [stale_features, unresolved_qb, incomplete_market_coverage]
  t1_team_strength:
    mode: active
    cap_margin_points: 10.0
    method: opponent_adjusted_ewma_epa_with_learned_shrinkage
  t2_quarterback_personnel:
    mode: shadow
    cap_margin_points: 7.0
    method: starter_mixture_and_position_weighted_availability
  t3_roster_continuity:
    mode: shadow
    cap_margin_points: 3.0
    method: snaps_weighted_continuity
  t4_venue_travel:
    mode: shadow
    cap_margin_points: 2.5
    method: hierarchical_venue_effect
  t5_rest_schedule:
    mode: shadow
    cap_margin_points: 0.75
    prior: near_zero
  t6_weather_surface:
    mode: shadow
    cap_total_points: 5.0
    primary_market: total
  t7_scheme_matchup:
    mode: rejected_diagnostic
    cap_margin_points: 2.0
    method: learned_interactions_only
    reason: negligible_margin_gain_and_worse_closing_market_distance
  context_event_register:
    mode: diagnostic
    may_change_price: false
    inherit_global_emotional_tier: false
    event_types: [head_coach_change, bereavement, milestone, player_return, rivalry, playoff_elimination]
    note: player_return_belongs_to_t2_and_rivalry_playoff_context_belongs_to_t1
  t8_market_disagreement:
    mode: diagnostic
    may_change_preopen_price: false
    live_statuses: [unresolved, watch_small, watch_medium, watch_large, watch_unstable_market]
    historical_large_disagreement_points: 3.0
    staking_allowed: false
    promotion_blockers: [true_opener_audit_incomplete, prospective_market_snapshots_missing]
  t9_confluence:
    mode: prospective_shadow_after_open
    purpose: detect_information_not_fully_priced_by_market
    distinct_signal_families_required: 3
    correlated_votes_count_once: true
    signal_families:
      - structural_team_strength
      - scheme_matchup
      - quarterback_personnel
      - venue_weather_schedule
      - independent_ml_shadow
    outputs: [direction, edge_points, confidence, contributing_matrices]
    action_on_conflict: reduce_confidence_or_abstain
    betting_action: none
    frozen_discovery_rule:
      structural_edge_min_points: 2.0
      independent_ml_edge_min_points: 2.0
      require_same_direction_personnel_increment: true
      note: threshold_is_retrospective_and_must_not_be_retuned_on_2026_shadow
    validation:
      require_timestamped_obtainable_line: true
      primary_metric: closing_line_value
      secondary_metrics: [ats_roi, edge_calibration, coverage]
      freeze_thresholds_before_test: true

validation:
  scheme: rolling_origin_by_week
  minimum_train_seasons: 5
  opening_tolerance_points: 0.25
  report_segments:
    - season
    - week_1_to_4
    - week_5_to_18
    - quarterback_change
    - key_number_3
    - key_number_7
    - favourite
    - underdog
  promotion_rule:
    minimum_games: 250
    minimum_seasons: 2
    bootstrap_confidence: 0.95
    require_positive_opening_beat_rate: true
    require_positive_mean_clv: true
  shadow_promotion:
    require_frozen_predictions: true
    require_ablation_gain: true
    require_margin_mae_gain: true
    require_brier_or_logloss_gain: true
    minimum_market_coverage: 0.90
    no_blend_before_predictions: 500

staking:
  enabled: false
  status: paper_only

final_readiness_2026:
  status: shadow_framework_ready_live_inputs_blocked
  official_price: t1_paper_only
  betting_enabled: false
  thresholds_frozen: true
  minimum_frozen_predictions_for_promotion: 500
  minimum_seasons_for_promotion: 2
  minimum_market_coverage: 0.90
