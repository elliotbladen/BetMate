# gitleaks configuration
#
# Keeps the FULL default ruleset (`useDefault = true`) and adds one narrow allowlist.
#
# WHY: the halftime capture files record `odds_api_game_id` — the PUBLIC event
# identifier The Odds API assigns to a fixture. It is a 32-char hex string, so the
# default `generic-api-key` rule matches it on entropy purely because the field name
# contains "api". The same identifiers appear in the odds snapshot CSVs and in request
# URLs; they are identifiers, not credentials, and grant nothing on their own.
#
# The allowlist requires BOTH conditions (condition = "AND"):
#   - the file is a halftime capture under BettingEngine/data/{afl,nrl}/halfTime/, and
#   - the flagged secret is exactly 32 lowercase hex characters
# so a real key landing in those directories — which would not be bare 32-hex — is
# still caught. A blanket path exclusion would have blinded the scanner there, which
# is the failure mode actually worth avoiding.

title = "BetMate"

[extend]
useDefault = true

[[allowlists]]
description = "The Odds API public event id in halftime captures — an identifier, not a secret"
condition = "AND"
paths = [
  '''BettingEngine/data/(afl|nrl)/halfTime/.*\.json$''',
]
regexes = [
  '''^[0-9a-f]{32}$''',
]
